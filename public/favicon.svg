<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fixitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f97316" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Radius -->
  <rect width="100" height="100" rx="24" fill="#0d1017" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#fixitGrad)" stroke-width="3" stroke-opacity="0.6" />

  <!-- Stylized Shield & Wrench / Fix Badge -->
  <g filter="url(#glow)">
    <!-- Wrench Body -->
    <path
      d="M38 25 C30 25 24 31 24 39 C24 44 26.5 48.5 30.5 51.5 L55 76 C56.5 77.5 59 77.5 60.5 76 L66 70.5 C67.5 69 67.5 66.5 66 65 L41.5 40.5 C42.5 38.5 43 36.5 43 34 C43 32.5 42.5 31 41.8 29.8 L48 23.5 C49 22.5 48.5 21 47 21 L39 21 C38.5 21 38 21.5 37.8 22 L34.5 26.5 C33.5 25.5 32 25 30.5 25 Z"
      fill="url(#fixitGrad)"
    />
    
    <!-- Dynamic Lightning Spark Bolt -->
    <path
      d="M62 20 L48 42 L58 42 L44 68 L68 38 L56 38 Z"
      fill="#ffffff"
      stroke="#ea580c"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
  </g>

  <!-- Bottom Accent Dot -->
  <circle cx="50" cy="88" r="3" fill="#f97316" />
</svg>
